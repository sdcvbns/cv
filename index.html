<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار تتبع الأشخاص التكتيكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/heatmap.js@2.0.5/build/heatmap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="main-header">
            <div class="header-title">
                <h1><i class="fa-solid fa-user-radar pulse-icon" style="color: #00ff66;"></i> نظام رادار تتبع الأشخاص والمسارات الحي</h1>
                <p>🛰️ مراقبة الإحداثيات الحية، خطوط السير، والنشاط الحراري للأفراد</p>
            </div>
            <div class="system-status">
                <span class="status-indicator online"></span>
                <span class="status-text">رصد الأهداف: نشط</span>
            </div>
        </header>

        <div class="main-content">
            <!-- اللوحة الجانبية: قائمة الأشخاص المراقبين -->
            <aside class="sidebar">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-users-viewfinder"></i> الأهداف النشطة (<span id="people-count">0</span>)</h2>
                </div>
                <div id="people-list" class="device-list-container">
                    <!-- كروت الأشخاص تولد هنا -->
                </div>
            </aside>

            <!-- منطقة الرادار والخريطة -->
            <main class="radar-panel">
                <div class="panel-header flex-header">
                    <h2><i class="fa-solid fa-crosshairs text-danger"></i> شاشة الرصد الجغرافي والمسارات</h2>
                    <span class="scan-loader">جاري تحديث الإحداثيات...</span>
                </div>
                <div class="radar-wrapper">
                    <div id="heatmap-area" class="heatmap-container">
                        <!-- مساحات رسم خطوط ومسارات السير -->
                        <svg id="tracks-svg" class="tracks-layer"></svg>
                        
                        <!-- خط مسح الرادار -->
                        <div class="radar-sweep"></div>
                        
                        <!-- نقاط الأشخاص (Nodes) سيتم حقنها هنا -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // 1. إعداد خريطة الحرارة لتعطي توهجاً حول الشخص
        const heatmapInstance = h337.create({
            container: document.getElementById('heatmap-area'),
            radius: 60,
            maxOpacity: 0.7,
            blur: 0.85,
            gradient: { '.2': '#00ff66', '.5': '#ffff00', '.9': '#ff0000' }
        });

        // 2. بيانات الأشخاص (الموقع الحالي + سجل المسار السابق)
        const peopleTargets = [
            { id: "p1", name: "أحمد المندلاوي", role: "قائد المجموعة", icon: "fa-user-shield", x: 200, y: 150, history: [], status: "normal" },
            { id: "p2", name: "سرمد (المشرف)", role: "مراقب النظام", icon: "fa-user-gear", x: 450, y: 280, history: [], status: "active" },
            { id: "p3", name: "علي الجبوري", role: "فريق ميداني 1", icon: "fa-user-polyline", x: 600, y: 120, history: [], status: "normal" },
            { id: "p4", name: "عمر الخالدي", role: "فريق ميداني 2", icon: "fa-user-ninja", x: 150, y: 380, history: [], status: "warning" },
            { id: "p5", name: "مهندس الموقع", role: "فحص فني", icon: "fa-user-astronaut", x: 350, y: 420, history: [], status: "normal" }
        ];

        // دالة لتحديث حركة الأشخاص بشكل واقعي (عشوائي مدروس) ورسم مسار خلفهم
        function simulateMovement() {
            const listContainer = document.getElementById('people-list');
            const mapContainer = document.getElementById('heatmap-area');
            const svgContainer = document.getElementById('tracks-svg');
            
            // تنظيف العناصر القديمة
            const oldNodes = mapContainer.querySelectorAll('.node-element');
            oldNodes.forEach(el => el.remove());
            listContainer.innerHTML = '';
            svgContainer.innerHTML = ''; // تنظيف خطوط المسار لرسمها مجدداً

            let thermalPoints = [];
            document.getElementById('people-count').innerText = peopleTargets.length;

            peopleTargets.forEach((person) => {
                // أ: حفظ الموقع الحالي في السجل (تاريخ المسار) قبل نقل الشخص للموقع الجديد
                if (person.history.length === 0 || 
                    person.history[person.history.length - 1].x !== person.x || 
                    person.history[person.history.length - 1].y !== person.y) {
                    
                    person.history.push({ x: person.x, y: person.y });
                    // الابقاء على آخر 6 نقاط فقط لعدم ملء الشاشة بالخطوط
                    if(person.history.length > 6) person.history.shift();
                }

                // ب: تحديث الإحداثيات (محاكاة مشي خطوة بخطوة)
                const moveX = (Math.random() - 0.5) * 40; 
                const moveY = (Math.random() - 0.5) * 40;
                
                person.x = Math.max(50, Math.min(mapContainer.clientWidth - 50, person.x + moveX));
                person.y = Math.max(50, Math.min(mapContainer.clientHeight - 50, person.y + moveY));

                // جـ: رسم خط المسار (Path) على طبقة الـ SVG
                if(person.history.length > 1) {
                    let pathPoints = person.history.map(pt => `${pt.x},${pt.y}`).join(' ');
                    // إضافة الموقع الحالي اللحظي لنهاية الخط
                    pathPoints += ` ${person.x},${person.y}`;

                    const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
                    polyline.setAttribute("points", pathPoints);
                    polyline.setAttribute("class", `track-line line-${person.status}`);
                    svgContainer.appendChild(polyline);
                }

                // د: إضافة النقاط الحرارية حول موقع الشخص الحالي
                thermalPoints.push({
                    x: Math.floor(person.x),
                    y: Math.floor(person.y),
                    value: person.status === 'warning' ? 90 : 50
                });

                // هـ: بناء كرت الشخص في القائمة الجانبية
                listContainer.innerHTML += `
                    <div class="device-card person-card status-${person.status}">
                        <div class="card-icon"><i class="fa-solid ${person.icon}"></i></div>
                        <div class="card-details">
                            <h3>${person.name}</h3>
                            <p>${person.role}</p>
                            <span class="coordinates-badge">X: ${Math.floor(person.x)} | Y: ${Math.floor(person.y)}</span>
                        </div>
                    </div>
                `;

                // و: إسقاط رمز الشخص على الخريطة ومؤشر النبض والـ Tooltip
                const nodeElement = document.createElement('div');
                nodeElement.className = `node-element target-person status-${person.status}`;
                nodeElement.style.left = `${person.x}px`;
                nodeElement.style.top = `${person.y}px`;
                
                nodeElement.innerHTML = `
                    <div class="node-pulse"></div>
                    <div class="node-dot"><i class="fa-solid ${person.icon}"></i></div>
                    <div class="node-tooltip">
                        <strong>${person.name}</strong><br>
                        الوظيفة: ${person.role}<br>
                        الإحداثيات: (${Math.floor(person.x)}, ${Math.floor(person.y)})
                    </div>
                `;
                mapContainer.appendChild(nodeElement);
            });

            // تحديث درجات التوهج الحراري للأشخاص
            heatmapInstance.setData({ max: 100, data: thermalPoints });
        }

        // تشغيل الرصد وتحديث المواقع تلقائياً كل 3 ثوانٍ بشكل مستمر حت تلاحظ حركة الأشخاص ورسم المسار خلفهم
        simulateMovement();
        setInterval(simulateMovement, 3000);
    </script>
</body>
</html>
